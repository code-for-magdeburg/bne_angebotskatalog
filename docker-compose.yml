version: "3.8"

networks:
  backend-network:
    driver: bridge

services:
  db:
    image: mariadb:latest
    container_name: bne_db
    restart: unless-stopped
    # Don't expose ports to host - only accessible within the network
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - backend-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bne_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      DB_NAME: ${MARIADB_DATABASE}
    volumes:
      - ./backend:/app
      - ./backend/public:/app/public
    networks:
      - backend-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: bne_nginx
    restart: unless-stopped
    ports:
      - "${PORT}:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./backend/public:/usr/share/nginx/html
    networks:
      - backend-network
    depends_on:
      - backend

volumes:
  db_data:
    driver: local
